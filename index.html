<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Rush</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #10182c; color: white;
    text-align: center; font-family: Arial, sans-serif;
  }
  h1 { color: #ffd84d; }
  canvas {
    display: block; margin: 12px auto;
    background: #8bd8ff; border: 3px solid white;
    width: 100%; max-width: 420px; touch-action: none;
  }
  button {
    padding: 14px 20px; margin: 5px; border: 0;
    border-radius: 10px; background: #1687f8; color: white;
    font-size: 18px; font-weight: bold;
  }
</style>
</head>
<body>
<h1>🎮 Pixel Rush</h1>
<p>Muévete, salta y recoge monedas.</p>
<canvas id="game" width="360" height="450"></canvas>
<div>
  <button id="left">⬅️</button>
  <button id="jump">⬆️ SALTAR</button>
  <button id="right">➡️</button>
</div>
<p id="status">Monedas: 0</p>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

const player = { x: 35, y: 340, w: 28, h: 40, vy: 0 };
const coin = { x: 230, y: 330, r: 10 };
const keys = { left: false, right: false };
let score = 0;
const groundY = 390;

function jump() {
  if (player.y >= groundY - player.h - 1) player.vy = -11;
}
function bindHold(id, key) {
  const button = document.getElementById(id);
  const down = e => { e.preventDefault(); keys[key] = true; };
  const up = e => { e.preventDefault(); keys[key] = false; };
  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointercancel", up);
  button.addEventListener("pointerleave", up);
}
bindHold("left", "left");
bindHold("right", "right");
document.getElementById("jump").addEventListener("pointerdown", e => {
  e.preventDefault(); jump();
});
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp") jump();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // cielo y nubes
  ctx.fillStyle = "#8bd8ff";
  ctx.fillRect(0, 0, 360, 450);
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(65, 65, 18, 0, Math.PI * 2);
  ctx.arc(85, 65, 24, 0, Math.PI * 2);
  ctx.arc(108, 68, 16, 0, Math.PI * 2); ctx.fill();
  // suelo
  ctx.fillStyle = "#2e9d4b"; ctx.fillRect(0, groundY, 360, 60);
  ctx.fillStyle = "#80502c"; ctx.fillRect(0, groundY + 12, 360, 48);
  // movimiento
  if (keys.left) player.x -= 3;
  if (keys.right) player.x += 3;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.vy += 0.48;
  player.y += player.vy;
  if (player.y > groundY - player.h) {
    player.y = groundY - player.h; player.vy = 0;
  }
  // jugador
  ctx.fillStyle = "#e84155";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "#ffd5a1";
  ctx.fillRect(player.x + 5, player.y + 4, 18, 13);
  ctx.fillStyle = "#242424";
  ctx.fillRect(player.x + 9, player.y + 8, 3, 3);
  ctx.fillRect(player.x + 18, player.y + 8, 3, 3);
  // moneda
  ctx.fillStyle = "#ffcc22";
  ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#d58b00"; ctx.lineWidth = 3; ctx.stroke();
  if (Math.abs((player.x + player.w/2) - coin.x) < 22 &&
      Math.abs((player.y + player.h/2) - coin.y) < 28) {
    score++;
    coin.x = 18 + Math.random() * 324;
    coin.y = 270 + Math.random() * 95;
    statusText.textContent = "Monedas: " + score;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
